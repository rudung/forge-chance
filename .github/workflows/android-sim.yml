name: Android APK Runtime Simulation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "build-tools;35.0.1" "platforms;android-35" >/dev/null || true

      - name: Install Godot 4.6.3
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/godot" "$HOME/.local/share/godot/export_templates/4.6.3.stable"
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d "$HOME/godot"
          GODOT_BIN="$(find "$HOME/godot" -maxdepth 1 -type f -name 'Godot*' | head -n 1)"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz" -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot_templates
          cp -a /tmp/godot_templates/templates/. "$HOME/.local/share/godot/export_templates/4.6.3.stable/"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.6.tres" <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT

      - name: Build simulator APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euxo pipefail
          sed -i 's/architectures\/x86_64=false/architectures\/x86_64=true/' export_presets.cfg
          mkdir -p build
          keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Forge Chance,C=KR"
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --import --quit
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --export-debug "Android Debug" build/forge-chance-sim.apk
          test -s build/forge-chance-sim.apk

      - name: Boot emulator and exercise enhancement
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -eux
            mkdir -p runtime-test
            adb install -r build/forge-chance-sim.apk
            adb shell wm size 1080x1920
            adb shell monkey -p com.rudung.forgechance 1
            sleep 5
            adb exec-out screencap -p > runtime-test/00_before.png
            adb logcat -c
            adb shell input tap 520 1250
            sleep 1
            adb exec-out screencap -p > runtime-test/01_after_1s.png
            sleep 3
            adb exec-out screencap -p > runtime-test/02_after_4s.png
            sleep 2
            adb exec-out screencap -p > runtime-test/03_after_6s.png
            adb logcat -d -v time > runtime-test/logcat.txt
            adb shell pidof com.rudung.forgechance > runtime-test/pid.txt
            test -s runtime-test/pid.txt
            if grep -E "SCRIPT ERROR|FATAL EXCEPTION|ANR in com.rudung.forgechance|Process com.rudung.forgechance has died" runtime-test/logcat.txt; then
              echo "Runtime failure detected"
              exit 1
            fi
            sha256sum runtime-test/*.png > runtime-test/screenshots.sha256
            cat runtime-test/screenshots.sha256

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-chance-runtime-simulation
          path: runtime-test/
          if-no-files-found: warn
